# Blueprint de Render (plan gratuito, para demostración): https://render.com/docs/blueprint-spec
# Sin disco persistente: la base se borra en cada reinicio o despliegue.
# Para conservar datos, usa render.starter-con-disco.yaml (plan de pago con disco).
services:
  - type: web
    name: reparared
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /tmp/reparared.db
      - key: SEED_DEMO
        value: "0"
      - key: ADMIN_EMAIL
        sync: false          # Render te lo pedirá al crear el servicio
      - key: ADMIN_PASSWORD
        sync: false
